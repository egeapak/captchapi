[package]
name = "captchapi"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "A REST API service for creating, validating, and consuming CAPTCHA challenges"
repository = "https://github.com/egeapak/captchapi"
keywords = ["captcha", "api", "rest", "security", "verification"]
categories = ["web-programming", "authentication"]

[workspace]
members = ["bindings/nodejs"]

[profile.release]
lto = true                # Full LTO for maximum size reduction
codegen-units = 1         # Better optimization (slower compile, smaller binary)
opt-level = "z"           # Optimize for size instead of speed
strip = true              # Strip debug symbols from binary
panic = "abort"           # Smaller panic handler

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tower_governor = "0.8"
governor = "0.10"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# CAPTCHA generation
captcha-rs = "0.2"
image = "0.24"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"

# Configuration
dotenvy = "0.15"

# Logging and Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.27"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
axum-test = "18"
tokio-test = "0.4"
mockito = "1.7"
tempfile = "3"
