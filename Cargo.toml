[package]
name = "captchapi"
version = "1.0.1"
rust-version = "1.94"
edition = "2021"
license = "Apache-2.0"
description = "A REST API service for creating, validating, and consuming CAPTCHA challenges"
repository = "https://github.com/egeapak/captchapi"
keywords = ["captcha", "api", "rest", "security", "verification"]
categories = ["web-programming", "authentication"]

[workspace]
members = ["bindings/nodejs"]

[profile.release]
lto = true                # Full LTO for maximum size reduction
codegen-units = 1         # Better optimization (slower compile, smaller binary)
opt-level = "z"           # Optimize for size instead of speed
strip = true              # Strip debug symbols from binary
panic = "abort"           # Smaller panic handler

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor = "0.10"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }

# CAPTCHA generation
# Kept to the minimum feature set: only JPEG is encoded and only text/shape
# drawing is used. Pulling `image`'s defaults would add every codec
# (AVIF, EXR, TIFF, PNG, WebP, ...) and ~76 transitive crates.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
imageproc = { version = "0.26", default-features = false, features = ["text"] }
ab_glyph = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
subtle = "2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rand = "0.10"

# Configuration
dotenvy = "0.15"

# Logging and Observability
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.32"

[dev-dependencies]
axum-test = "20"
tokio-test = "0.4"
tempfile = "3"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
futures-util = "0.3"
