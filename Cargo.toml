[package]
name = "captchapi"
version = "1.0.1"
rust-version = "1.94"
edition = "2021"
license = "Apache-2.0"
description = "A REST API service for creating, validating, and consuming CAPTCHA challenges"
repository = "https://github.com/egeapak/captchapi"
keywords = ["captcha", "api", "rest", "security", "verification"]
categories = ["web-programming", "authentication"]

[workspace]
members = ["bindings/nodejs"]

[profile.release]
lto = true                # Full LTO for maximum size reduction
codegen-units = 1         # Better optimization (slower compile, smaller binary)
opt-level = "z"           # Optimize for size instead of speed
strip = true              # Strip debug symbols from binary
panic = "abort"           # Smaller panic handler

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor = "0.10"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled", "migrate"] }

# CAPTCHA generation
# Kept to the minimum feature set: only JPEG is encoded. Pulling `image`'s
# defaults would add every codec (AVIF, EXR, TIFF, PNG, WebP, ...) and ~76
# transitive crates.
#
# The drawing and noise routines are vendored in services/captcha/drawing.rs
# rather than taken from `imageproc`, which declares `nalgebra` with no feature
# to switch it off — see that module and CLAUDE.md.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ab_glyph = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
subtle = "2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rand = "0.10"

# Configuration
dotenvy = "0.15"
# `eq-separator` is not a default feature, but `--port=8080` is a form users expect.
pico-args = { version = "0.5", features = ["eq-separator"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# Logging and Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# The OpenTelemetry API crate is unconditional: src/metrics.rs builds all of
# the service's counters and histograms on it. It is API-only and cheap.
opentelemetry = "0.32"

# Trace *export*, behind the `otel` feature. The OTLP exporter drags in a full
# HTTP client (reqwest and friends) worth roughly 700 KB of binary, for a code
# path that is inert unless OTEL_ENABLED is set at runtime.
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", features = [
    "http-proto",
    "reqwest-client",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.32", optional = true }

# At-rest encryption of stored CAPTCHA images.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
    "alloc",
    "getrandom",
] }

[features]
default = []
# Embed the admin console (a static HTML/CSS/JS page) in the binary and serve it
# at /admin. Off by default: it is dead weight for anyone driving the admin API
# from curl or a config file, and this binary is optimised for size.
admin-ui = []
# Compile in the OpenTelemetry OTLP exporter. Traces are still gated at
# runtime by OTEL_ENABLED; this only controls whether the exporter exists.
otel = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
]

# Signal delivery for `captchapi reload` (SIGHUP). Already in the tree via tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum-test = "20"
tokio-test = "0.4"
tempfile = "3"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
futures-util = "0.3"
