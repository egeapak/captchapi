# =============================================================================
# CaptchAPI - Transient Mode (No Persistence)
# =============================================================================
#
# DATABASE: Stored in container, lost on restart
# SECURITY: Runs as nonroot (UID 65532)
# USE CASE: Testing, stateless deployments, development
#
# USAGE:
#   docker-compose -f docker-compose.transient.yml up -d
#
# =============================================================================

services:
  captchapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: captchapi:latest
    container_name: captchapi-transient
    restart: unless-stopped

    ports:
      - "3000:3000"

    # No volumes - database lives in container
    # Works immediately with nonroot user, no permission setup needed

    environment:
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000

      # Database (in-container, ephemeral)
      DATABASE_URL: sqlite:/data/captchapi.db

      # Security - CHANGE THESE IN PRODUCTION!
      # Generate with: openssl rand -base64 32
      API_KEY_SALT: change-this-to-a-random-salt-in-production
      MASTER_API_KEY: change-this-to-a-secure-master-key-in-production

      # CAPTCHA Configuration
      DEFAULT_SESSION_TTL_SECONDS: 300
      MAX_SESSION_TTL_SECONDS: 3600
      MAX_VALIDATION_ATTEMPTS: 3

      # Background Tasks
      CLEANUP_INTERVAL_SECONDS: 60
