<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CaptchAPI admin</title>
<style>
:root{color-scheme:dark;--bg:#14161a;--panel:#1b1e24;--line:#2b3038;--fg:#e6e8ec;--dim:#8b93a1;--accent:#5b9dd9;--warn:#d98b5b;--ok:#6bbf7b;--err:#d96b6b}
*{box-sizing:border-box}
body{margin:0;padding:2rem 1rem;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:60rem;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 .25rem}
.sub{color:var(--dim);font-size:.85rem;margin:0 0 1.5rem}
fieldset{border:0;padding:0;margin:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:.3rem}
input,button{font:inherit;color:inherit;border-radius:6px;border:1px solid var(--line)}
input{background:#0f1115;padding:.45rem .6rem;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
input:disabled{color:var(--dim);background:#171a1f}
button{background:var(--panel);padding:.45rem .9rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b0d10;font-weight:600}
table{width:100%;border-collapse:collapse;margin:1rem 0}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);padding:.4rem .5rem;border-bottom:1px solid var(--line)}
td{padding:.35rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
td.k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;white-space:nowrap}
td.v{width:40%}
.tag{font-size:.7rem;padding:.1rem .4rem;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.tag.live{color:var(--ok);border-color:#2f5136}
.tag.dirty{color:var(--warn);border-color:#5a4229}
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.bar .spacer{flex:1}
.msg{padding:.5rem .75rem;border-radius:6px;border:1px solid var(--line);margin:1rem 0;font-size:.9rem;display:none}
.msg.on{display:block}
.msg.err{color:var(--err);border-color:#5a2f2f}
.msg.ok{color:var(--ok);border-color:#2f5136}
.gate{max-width:24rem;margin:4rem auto;background:var(--panel);padding:1.5rem;border:1px solid var(--line);border-radius:10px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>CaptchAPI admin</h1>
  <p class="sub">Runtime configuration. Live fields apply immediately; boot fields need a restart.</p>

  <div id="msg" class="msg"></div>

  <form id="gate" class="gate">
    <label for="key">Master API key</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <p class="sub" style="margin:.75rem 0 0">Held in memory for this tab only.</p>
    <button class="primary" style="margin-top:.75rem;width:100%">Unlock</button>
  </form>

  <section id="panel" class="hide">
    <table>
      <thead><tr><th>Field</th><th>Value</th><th>Scope</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="bar">
      <button id="apply" class="primary" disabled>Apply changes</button>
      <button id="revert" disabled>Revert</button>
      <span class="spacer"></span>
      <button id="reload">Reload from sources</button>
      <button id="cleanup">Run cleanup</button>
      <button id="lock">Lock</button>
    </div>
    <p class="sub" id="ovr" style="margin-top:1rem"></p>
  </section>
</main>
<!-- Absolute: a relative src resolves against /admin (no trailing slash) and would 404. -->
<script src="/admin/app.js"></script>
</body>
</html>
