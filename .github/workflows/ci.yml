name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_OFFLINE: true  # Use offline mode for SQLx compile-time verification

jobs:
  sqlx-check:
    name: SQLx Offline Data Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify .sqlx directory exists
        run: |
          if [ ! -d ".sqlx" ]; then
            echo "❌ .sqlx directory not found!"
            echo "Run 'cargo sqlx prepare' to generate offline query data"
            exit 1
          fi
          echo "✅ .sqlx directory found"

      - name: Check compilation with offline mode
        run: cargo check --all-targets --all-features
        env:
          SQLX_OFFLINE: true

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite

      - name: Create database for sqlx verification
        run: |
          mkdir -p data
          cargo sqlx database create
          cargo sqlx migrate run
        env:
          DATABASE_URL: sqlite:./data/captchapi.db

      - name: Verify offline data is up-to-date
        run: cargo sqlx prepare --check --workspace
        env:
          DATABASE_URL: sqlite:./data/captchapi.db

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Both feature configurations are linted: `--all-features` covers the
      # OpenTelemetry code, and the default build covers the cfg(not(otel))
      # paths that would otherwise never be compiled in CI.
      - name: Run Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Fails the build on RustSec vulnerabilities and yanked crates.
      # Informational advisories (unmaintained/unsound) are reported as
      # warnings and do not fail the build.
      - name: Audit dependencies
        run: cargo audit

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [sqlx-check, format, clippy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run tests
        run: cargo nextest run --all-features --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          # Extract coverage from lcov.info instead of running cargo llvm-cov again
          total_lines=$(grep -E '^LF:' lcov.info | cut -d: -f2 | awk '{s+=$1} END {print s}')
          covered_lines=$(grep -E '^LH:' lcov.info | cut -d: -f2 | awk '{s+=$1} END {print s}')
          coverage=$(awk "BEGIN {printf \"%.2f\", ($covered_lines / $total_lines) * 100}")
          echo "Coverage: ${coverage}% (${covered_lines}/${total_lines} lines)"
          if (( $(echo "$coverage < 85" | bc -l) )); then
            echo "❌ Coverage ${coverage}% is below threshold (85%)"
            exit 1
          fi
          echo "✅ Coverage ${coverage}% meets threshold"

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Create .env file
        run: |
          cat > .env << EOF
          SERVER_HOST=127.0.0.1
          SERVER_PORT=3000
          DATABASE_URL=sqlite:./data/captchapi.db
          API_KEY_SALT=ci-test-salt-do-not-use-in-production
          MASTER_API_KEY=ci-test-master-key-do-not-use-in-production
          DEFAULT_SESSION_TTL_SECONDS=300
          MAX_SESSION_TTL_SECONDS=3600
          MAX_VALIDATION_ATTEMPTS=3
          CLEANUP_INTERVAL_SECONDS=60
          RATE_LIMIT_REQUESTS_PER_SECOND=100
          RATE_LIMIT_BURST_SIZE=200
          EOF

      - name: Build project
        run: cargo build --release

      - name: Start server
        run: |
          cargo run --release &
          echo $! > server.pid

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          max_attempts=30
          attempt=0
          until curl -f http://127.0.0.1:3000/health > /dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ $attempt -eq $max_attempts ]; then
              echo "Server failed to start after $max_attempts attempts"
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Server not ready yet..."
            sleep 2
          done
          echo "Server is ready!"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache global npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli@4.0.0

      - name: Run API tests
        env:
          BRUNO_ENV: ci
        run: ./.bruno/Tests/Scripts/test-bruno-full.sh

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: |
            .bruno/Tests/
            *.log
