name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG"

      - name: Get version from Cargo.toml
        id: cargo-version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "cargo_version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $CARGO_VERSION"

      - name: Compare versions
        run: |
          TAG_VERSION="${{ steps.get-version.outputs.version }}"
          CARGO_VERSION="${{ steps.cargo-version.outputs.cargo_version }}"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Tag version: v$TAG_VERSION"
            echo "Cargo.toml version: $CARGO_VERSION"
            echo ""
            echo "Please update Cargo.toml version to match the tag version."
            exit 1
          fi

          echo "✅ Version match confirmed: $TAG_VERSION"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Docker images (CircleCI)
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"

          echo "⏳ Waiting for CircleCI to build and push Docker images..."
          echo "Checking for: $IMAGE"

          max_attempts=60  # 30 minutes max (60 * 30s)
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Checking if image exists..."

            # Try to inspect the image (this will fail if image doesn't exist)
            if docker manifest inspect $IMAGE > /dev/null 2>&1; then
              echo "✅ Docker images are ready!"
              docker manifest inspect $IMAGE
              break
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Timeout waiting for Docker images after $max_attempts attempts"
              echo "CircleCI might still be building. Check: https://app.circleci.com/pipelines/github/${{ github.repository }}"
              exit 1
            fi

            echo "Image not ready yet, waiting 30 seconds..."
            sleep 30
          done

      - name: Generate release notes with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ needs.validate-version.outputs.version }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "🎉 Release v${{ needs.validate-version.outputs.version }} created successfully!"
          echo ""
          echo "📦 Docker images (built by CircleCI):"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-version.outputs.version }}"
          echo ""
          echo "🔗 Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF#refs/tags/}"
          echo "🔗 CircleCI Pipeline: https://app.circleci.com/pipelines/github/${{ github.repository }}"
