name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG"

      - name: Get version from Cargo.toml
        id: cargo-version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "cargo_version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $CARGO_VERSION"

      - name: Compare versions
        run: |
          TAG_VERSION="${{ steps.get-version.outputs.version }}"
          CARGO_VERSION="${{ steps.cargo-version.outputs.cargo_version }}"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Tag version: v$TAG_VERSION"
            echo "Cargo.toml version: $CARGO_VERSION"
            echo ""
            echo "Please update Cargo.toml version to match the tag version."
            exit 1
          fi

          echo "✅ Version match confirmed: $TAG_VERSION"

  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run tests
        run: cargo nextest run --all-features --workspace

  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    runs-on: ubuntu-latest
    needs: [validate-version, ci]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build AMD64 binary
        run: |
          echo "🔨 Building AMD64 binary..."
          cross build --release --target x86_64-unknown-linux-musl --bin captchapi
          ls -lh target/x86_64-unknown-linux-musl/release/captchapi

      - name: Build ARM64 binary
        run: |
          echo "🔨 Building ARM64 binary..."
          cross build --release --target aarch64-unknown-linux-musl --bin captchapi
          ls -lh target/aarch64-unknown-linux-musl/release/captchapi

      - name: Prepare Docker build context
        run: |
          echo "📦 Preparing binaries for Docker build..."
          mkdir -p docker/bin
          cp target/x86_64-unknown-linux-musl/release/captchapi docker/bin/captchapi-amd64
          cp target/aarch64-unknown-linux-musl/release/captchapi docker/bin/captchapi-arm64
          chmod +x docker/bin/captchapi-*
          echo "✅ Binaries ready:"
          ls -lh docker/bin/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # The image is otherwise built and pushed without ever being run. This catches the
          # class of bug where the container starts but writes its state somewhere other than
          # the /data volume, which is invisible to every other check.
          set -euo pipefail
          # Build the multiarch Dockerfile — the one that actually ships — for a single
          # platform so it can be loaded and run. It consumes docker/bin/captchapi-amd64,
          # which the "Prepare Docker build context" step above produced.
          docker buildx build --platform linux/amd64 --load \
            -t captchapi:smoke -f ./docker/Dockerfile.multiarch .
          docker volume create captchapi-smoke
          docker run -d --name captchapi-smoke -p 3000:3000 \
            -v captchapi-smoke:/data \
            -e API_KEY_SALT=smoke-test-salt-minimum-16 \
            -e MASTER_API_KEY=smoke-test-master-key-16 \
            captchapi:smoke

          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/health && break
            sleep 2
          done
          curl -fs http://127.0.0.1:3000/health

          # The database and pid file must land in the mounted volume, not in the image's
          # ephemeral layer — otherwise the documented volume mode silently loses data.
          docker run --rm -v captchapi-smoke:/data alpine ls /data > volume.txt
          cat volume.txt
          grep -q captchapi.db  volume.txt || { echo "::error::database not in /data volume"; exit 1; }
          grep -q captchapi.pid volume.txt || { echo "::error::pid file not in /data volume"; exit 1; }

          # SIGHUP must reload rather than terminate.
          docker kill -s HUP captchapi-smoke
          sleep 3
          curl -fs http://127.0.0.1:3000/health || { echo "::error::SIGHUP killed the server"; exit 1; }
          docker logs captchapi-smoke 2>&1 | grep -q "Configuration reloaded" \
            || { echo "::error::SIGHUP did not reload the configuration"; exit 1; }

          echo "✅ Container smoke test passed"

      - name: Clean up smoke test
        if: always()
        run: |
          docker rm -f captchapi-smoke || true
          docker volume rm -f captchapi-smoke || true

      - name: Build summary
        run: |
          echo "🎉 Multi-platform image built and pushed!"
          echo ""
          echo "📦 Binary sizes:"
          ls -lh docker/bin/
          echo ""
          echo "🐳 Platforms: linux/amd64, linux/arm64"
          echo "📍 Registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, build-and-push]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ needs.validate-version.outputs.version }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "🎉 Release v${{ needs.validate-version.outputs.version }} created successfully!"
          echo ""
          echo "📦 Docker image published:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-version.outputs.version }}"
          echo ""
          echo "🔗 Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF#refs/tags/}"
