name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      prerelease: ${{ steps.get-version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get-version
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/v}

          # The tag drives every downstream decision — which container tags move, whether the
          # GitHub release is marked as a pre-release — so reject anything that is not semver
          # here rather than letting a typo silently produce a half-tagged image.
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "❌ Tag v$TAG is not a semantic version (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi

          # A hyphen is semver's pre-release marker. `latest`, `{{major}}` and `{{major}}.{{minor}}`
          # are all suppressed for these, so that `docker pull ...:latest` and `...:1` can never
          # land a user on a release candidate.
          if [[ "$TAG" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi

          {
            echo "version=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag version: $TAG (prerelease: $PRERELEASE)"

      - name: Get version from Cargo.toml
        id: cargo-version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "cargo_version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $CARGO_VERSION"

      - name: Compare versions
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.get-version.outputs.version }}"
          CARGO_VERSION="${{ steps.cargo-version.outputs.cargo_version }}"

          # Compare on the release core (MAJOR.MINOR.PATCH), not the whole tag.
          #
          # A release candidate for 2.0.0 is built from the tree that will become
          # 2.0.0, so its Cargo.toml says `2.0.0` while the tag says
          # `2.0.0-rc.1`. Requiring exact equality made every prerelease tag fail
          # here — which contradicted the step above, added at the same time,
          # that exists specifically to classify them and hold `latest` back. No
          # RC could ship while both rules were in force.
          #
          # Strips semver's pre-release (`-rc.1`) and build (`+build.5`) suffixes,
          # both of which the regex above accepts. The core must still match
          # exactly, so a tag built from the wrong tree is still caught.
          TAG_CORE="${TAG_VERSION%%[-+]*}"

          if [ "$TAG_CORE" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Tag version: v$TAG_VERSION (core: $TAG_CORE)"
            echo "Cargo.toml version: $CARGO_VERSION"
            echo ""
            echo "Please update Cargo.toml version to match the tag version."
            exit 1
          fi

          if [ "$TAG_CORE" != "$TAG_VERSION" ]; then
            echo "✅ Version match confirmed: $TAG_CORE (from prerelease tag $TAG_VERSION)"
          else
            echo "✅ Version match confirmed: $TAG_VERSION"
          fi

  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run tests
        run: cargo nextest run --all-features --workspace

  # The binaries are built once and reused by every image variant. Cross-compiling is the
  # expensive part of a release (two musl targets under full LTO); building them inside the
  # publish matrix would repeat that work per variant for a byte-identical result.
  build-binaries:
    name: Cross-compile static binaries
    runs-on: ubuntu-latest
    needs: [validate-version, ci]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build AMD64 binary
        run: |
          echo "🔨 Building AMD64 binary..."
          cross build --release --features otel --target x86_64-unknown-linux-musl --bin captchapi
          ls -lh target/x86_64-unknown-linux-musl/release/captchapi

      - name: Build ARM64 binary
        run: |
          echo "🔨 Building ARM64 binary..."
          cross build --release --features otel --target aarch64-unknown-linux-musl --bin captchapi
          ls -lh target/aarch64-unknown-linux-musl/release/captchapi

      - name: Prepare Docker build context
        run: |
          echo "📦 Preparing binaries for Docker build..."
          mkdir -p docker/bin
          cp target/x86_64-unknown-linux-musl/release/captchapi docker/bin/captchapi-amd64
          cp target/aarch64-unknown-linux-musl/release/captchapi docker/bin/captchapi-arm64
          chmod +x docker/bin/captchapi-*
          echo "✅ Binaries ready:"
          ls -lh docker/bin/

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: captchapi-musl-binaries
          path: docker/bin/captchapi-*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Publish ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    needs: [validate-version, build-binaries]
    permissions:
      contents: read
      packages: write
      # Both are required by actions/attest-build-provenance: `id-token` to mint the OIDC
      # token the signature is bound to, `attestations` to record it against the repository.
      id-token: write
      attestations: write
    strategy:
      # Publish every variant that can be published. Failing fast would leave the registry
      # holding one variant of a release and not the other, which is worse than two red jobs.
      fail-fast: false
      matrix:
        include:
          # The default, on bare tags. Distroless carries tzdata, a CA bundle and a real
          # /etc/passwd, so nothing has to be hand-staged and anything expecting a
          # conventional base still works. Keeping it on the bare tags also means `latest`
          # continues to mean what it has always meant for existing deployments.
          - variant: distroless
            dockerfile: ./docker/Dockerfile.multiarch
            prefix: ''
          # Published under `scratch-` prefixed tags: 22% smaller to pull and 40% smaller
          # unpacked, essentially all of it tzdata that a service storing unix timestamps
          # never reads. A variant rather than the default because everything distroless
          # provides — /data, /tmp, passwd/group, the CA bundle — is hand-staged in that
          # Dockerfile, so there is more to get wrong and no shell in which to find out.
          - variant: scratch
            dockerfile: ./docker/Dockerfile.scratch
            prefix: 'scratch-'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ghcr.io rejects uppercase characters in a repository path, and `github.repository`
      # preserves the case of the owner. metadata-action lowercases its own `images:` input,
      # but the attestation subject and the size probe consume this value directly, so
      # normalise it once here. `$GITHUB_ENV` shadows the workflow-level value for this job.
      - name: Normalise image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: captchapi-musl-binaries
          path: docker/bin

      - name: Restore executable bit
        # Artifact upload does not preserve the mode, and a non-executable ENTRYPOINT fails
        # only at `docker run`, i.e. in the smoke test, with a confusing "permission denied".
        run: |
          chmod +x docker/bin/captchapi-*
          ls -lh docker/bin/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest`, `{{major}}` and `{{major}}.{{minor}}` are *moving* tags: publishing a
          # pre-release under them silently upgrades everyone who tracks them. Only the exact
          # `{{version}}` tag is unconditional, so `v2.0.0-rc.1` is pullable by name and by
          # nothing else. This used to be `type=raw,value=latest`, which fired on every tag.
          #
          # `prefix` distinguishes the variants: distroless takes the bare tags and scratch
          # takes `scratch-` ones, so `latest` and `scratch-latest` are both meaningful and
          # neither job can overwrite the other's. `onlatest=true` is what extends the prefix
          # to `latest` as well — without it the scratch job would publish a bare `latest` and
          # race the distroless job for it, and which one won would depend on scheduling.
          flavor: |
            latest=${{ needs.validate-version.outputs.prerelease == 'false' }}
            prefix=${{ matrix.prefix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.validate-version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ needs.validate-version.outputs.prerelease == 'false' }}

      # The smoke test runs BEFORE the push, and the ordering is the point: it used to run
      # after, so an image that failed it had already been published — including under
      # `latest`, where every default `docker pull` would pick it up. Building single-platform
      # with `load: true` is the only way to get a runnable image locally; the multi-platform
      # push below reuses these layers from the build cache.
      - name: Build AMD64 image for smoke testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: captchapi:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test the image
        run: |
          # The image is otherwise built and pushed without ever being run. This catches the
          # class of bug where the container starts but writes its state somewhere other than
          # the /data volume, which is invisible to every other check. Both variants get the
          # identical treatment: the scratch one has no shell to debug with after the fact,
          # so it is the one that most needs proving before it is published.
          set -euo pipefail
          docker volume create captchapi-smoke
          docker run -d --name captchapi-smoke -p 3000:3000 \
            -v captchapi-smoke:/data \
            -e API_KEY_SALT=smoke-test-salt-minimum-16 \
            -e MASTER_API_KEY=smoke-test-master-key-16 \
            captchapi:smoke

          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/health && break
            sleep 2
          done
          curl -fs http://127.0.0.1:3000/health

          # The database and pid file must land in the mounted volume, not in the image's
          # ephemeral layer — otherwise the documented volume mode silently loses data.
          docker run --rm -v captchapi-smoke:/data alpine ls /data > volume.txt
          cat volume.txt
          grep -q captchapi.db  volume.txt || { echo "::error::database not in /data volume"; exit 1; }
          grep -q captchapi.pid volume.txt || { echo "::error::pid file not in /data volume"; exit 1; }

          # One full challenge round-trip. /health proves the process is up; it does not touch
          # the renderer, the embedded font, ChaCha20-Poly1305 or SQLite. This does, and it is
          # the only check that would catch a binary shipped without its font asset.
          SESSION_ID=$(curl -fsS -X POST http://127.0.0.1:3000/api/v1/sessions \
            -H "Authorization: Bearer smoke-test-master-key-16" \
            -H "Content-Type: application/json" \
            -d '{"difficulty":5}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_id"])')
          echo "Created session $SESSION_ID"

          # Binary JPEG, so check the content type rather than trusting a 200.
          CONTENT_TYPE=$(curl -fsS -o captcha.jpeg -w '%{content_type}' \
            "http://127.0.0.1:3000/api/v1/sessions/$SESSION_ID/image.jpeg")
          [ "$CONTENT_TYPE" = "image/jpeg" ] \
            || { echo "::error::image endpoint returned $CONTENT_TYPE, expected image/jpeg"; exit 1; }
          # SOI marker: the bytes have to decode as a JPEG, not merely arrive.
          head -c 2 captcha.jpeg | od -An -tx1 | grep -q 'ff d8' \
            || { echo "::error::image endpoint did not return JPEG data"; exit 1; }
          echo "Retrieved $(wc -c < captcha.jpeg) byte CAPTCHA image"

          # SIGHUP must reload rather than terminate.
          docker kill -s HUP captchapi-smoke
          sleep 3
          curl -fs http://127.0.0.1:3000/health || { echo "::error::SIGHUP killed the server"; exit 1; }
          docker logs captchapi-smoke 2>&1 | grep -q "Configuration reloaded" \
            || { echo "::error::SIGHUP did not reload the configuration"; exit 1; }

          echo "✅ Container smoke test passed"

      - name: Clean up smoke test
        if: always()
        run: |
          docker rm -f captchapi-smoke || true
          docker volume rm -f captchapi-smoke || true

      # Only now, with the amd64 image proven to serve a CAPTCHA, is anything published.
      - name: Build and push multi-platform Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Signed, verifiable provenance for the pushed digest:
      #   gh attestation verify oci://ghcr.io/egeapak/captchapi:1.0.1 --repo egeapak/captchapi
      # This is what lets a consumer establish the image came from this workflow on this
      # commit, which a registry tag alone cannot say.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Image size is a documented feature of this project, and the published numbers have
      # drifted before. Measuring at release time puts the real figures in the run summary,
      # so a regression shows up next to the release rather than in a stale README.
      - name: Report image size
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          REF="$IMAGE@${{ steps.push.outputs.digest }}"

          # Pull size is the sum of the *compressed* layer blobs the registry serves, per
          # platform. `docker images` reports a third, larger number that includes
          # storage-driver overhead and matches neither; do not quote it.
          INDEX=$(docker buildx imagetools inspect "$REF" --raw)

          {
            echo "## Image size — ${{ matrix.variant }}"
            echo ""
            echo "| platform | pull (compressed) | layers |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for ARCH in amd64 arm64; do
            # Filtering on architecture also drops the provenance/SBOM manifests buildx
            # attaches, which carry platform unknown/unknown.
            DIGEST=$(echo "$INDEX" | jq -r --arg a "$ARCH" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' | head -1)
            MANIFEST=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)
            BYTES=$(echo "$MANIFEST" | jq '[.layers[].size] | add')
            COUNT=$(echo "$MANIFEST" | jq '.layers | length')
            printf '| linux/%s | %.2f MB (%s bytes) | %s |\n' \
              "$ARCH" "$(echo "$BYTES / 1000000" | bc -l)" "$BYTES" "$COUNT" >> "$GITHUB_STEP_SUMMARY"
          done

          # Unpacked size, from the amd64 image the smoke test already built and loaded. This
          # is the flattened filesystem, which is what `docker export` produces.
          CONTAINER=$(docker create captchapi:smoke)
          UNPACKED=$(docker export "$CONTAINER" | wc -c)
          docker rm "$CONTAINER" > /dev/null
          BINARY=$(stat -c %s docker/bin/captchapi-amd64)
          {
            echo ""
            printf 'linux/amd64 unpacked: **%.2f MB** (%s bytes), of which the binary is %.2f MB.\n' \
              "$(echo "$UNPACKED / 1000000" | bc -l)" "$UNPACKED" "$(echo "$BINARY / 1000000" | bc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build summary
        run: |
          {
            echo "### Published — ${{ matrix.variant }}"
            echo ""
            echo "Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Binary sizes:"
          ls -lh docker/bin/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, build-and-push]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ needs.validate-version.outputs.version }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          # Derived from the tag, not hardcoded: a hardcoded `false` made every release
          # candidate GitHub's "Latest release" and put it in the repository sidebar.
          prerelease: ${{ needs.validate-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate-version.outputs.prerelease == 'false' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "🎉 Release v${{ needs.validate-version.outputs.version }} created successfully!"
          echo ""
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          VERSION="${{ needs.validate-version.outputs.version }}"
          echo "📦 Docker images published:"
          echo "  - $IMAGE:$VERSION           (distroless, the default)"
          echo "  - $IMAGE:scratch-$VERSION   (scratch variant)"
          if [ "${{ needs.validate-version.outputs.prerelease }}" = "false" ]; then
            echo "  - $IMAGE:latest"
            echo "  - $IMAGE:scratch-latest"
          else
            echo "  (pre-release: the latest/major/minor tags were not moved)"
          fi
          echo ""
          echo "🔗 Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF#refs/tags/}"
