# =============================================================================
# CaptchAPI - Docker Volume Mode (Recommended)
# =============================================================================
#
# DATABASE: Persistent in Docker-managed volume
# SECURITY: Runs as nonroot (UID 65532) with automatic permission setup
# USE CASE: Production, development with persistence
#
# FEATURES:
#   ✓ Automatic permission handling via init container
#   ✓ Persistent across container restarts
#   ✓ Easy backups with docker volume commands
#   ✓ Fully secure (nonroot)
#
# USAGE:
#   docker-compose -f docker-compose.volume.yml up -d
#
# BACKUP:
#   docker run --rm -v captchapi_captchapi-data:/data -v $(pwd):/backup \
#     alpine tar czf /backup/captchapi-backup.tar.gz /data
#
# =============================================================================

services:
  captchapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: captchapi:latest
    container_name: captchapi
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - captchapi-data:/data

    environment:
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000

      # Database (Docker volume, persistent)
      DATABASE_URL: sqlite:/data/captchapi.db

      # Security - CHANGE THESE IN PRODUCTION!
      # Generate with: openssl rand -base64 32
      API_KEY_SALT: change-this-to-a-random-salt-in-production
      MASTER_API_KEY: change-this-to-a-secure-master-key-in-production

      # CAPTCHA Configuration
      DEFAULT_SESSION_TTL_SECONDS: 300
      MAX_SESSION_TTL_SECONDS: 3600
      MAX_VALIDATION_ATTEMPTS: 3

      # Background Tasks
      CLEANUP_INTERVAL_SECONDS: 60

    # Ensure volume has correct permissions before starting
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  # Helper container to set correct permissions on Docker volume
  # Runs once at startup to ensure /data is writable by nonroot user (UID 65532)
  init-permissions:
    image: alpine:latest
    container_name: captchapi-init
    volumes:
      - captchapi-data:/data
    command: chown -R 65532:65532 /data
    restart: "no"

volumes:
  captchapi-data:
    driver: local
