version: 2.1

# Jobs
jobs:
  build-multi-arch:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    steps:
      - checkout
      - run:
          name: Set up Docker Buildx
          command: |
            docker buildx create --name multiarch --driver docker-container --use --bootstrap || true
            docker buildx ls
      - run:
          name: Log in to GHCR
          command: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin
      - run:
          name: Build and push multi-platform image
          command: |
            REGISTRY="ghcr.io"
            IMAGE_NAME="${GITHUB_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            VERSION="${CIRCLE_TAG#v}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file ./docker/Dockerfile \
              --tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} \
              --tag ${REGISTRY}/${IMAGE_NAME}:latest \
              --cache-from type=registry,ref=${REGISTRY}/${IMAGE_NAME}:buildcache \
              --cache-to type=registry,ref=${REGISTRY}/${IMAGE_NAME}:buildcache,mode=max \
              --push \
              .
      - run:
          name: Inspect multi-platform image
          command: |
            REGISTRY="ghcr.io"
            IMAGE_NAME="${GITHUB_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            VERSION="${CIRCLE_TAG#v}"

            echo "Inspecting ${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            docker buildx imagetools inspect ${REGISTRY}/${IMAGE_NAME}:${VERSION}

# Workflows
workflows:
  version: 2

  # Build on tag push
  release:
    jobs:
      - build-multi-arch:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          context:
            - github-packages
