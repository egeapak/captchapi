# =============================================================================
# CaptchAPI - Default Configuration (Docker Volume)
# =============================================================================
#
# This is the default, recommended configuration using Docker volumes.
#
# OTHER OPTIONS:
#   - docker-compose.transient.yml    (no persistence, testing)
#   - docker-compose.volume.yml       (same as this file)
#   - docker-compose.bindmount.yml    (host directory mount)
#
# QUICK START:
#   docker-compose up -d
#
# See DOCKER_USAGE.md for complete documentation
#
# =============================================================================

services:
  captchapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: captchapi:latest
    container_name: captchapi
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - captchapi-data:/data

    environment:
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000

      # Database (Docker volume, persistent)
      DATABASE_URL: sqlite:/data/captchapi.db

      # Security - CHANGE THESE IN PRODUCTION!
      # Generate with: openssl rand -base64 32
      API_KEY_SALT: change-this-to-a-random-salt-in-production
      MASTER_API_KEY: change-this-to-a-secure-master-key-in-production

      # CAPTCHA Configuration
      DEFAULT_SESSION_TTL_SECONDS: 300
      MAX_SESSION_TTL_SECONDS: 3600
      MAX_VALIDATION_ATTEMPTS: 3

      # Background Tasks
      CLEANUP_INTERVAL_SECONDS: 60

    # Ensure volume has correct permissions before starting
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  # Helper container to set correct permissions on Docker volume
  # Runs once at startup to ensure /data is writable by nonroot user (UID 65532)
  init-permissions:
    image: alpine:latest
    container_name: captchapi-init
    volumes:
      - captchapi-data:/data
    command: chown -R 65532:65532 /data
    restart: "no"

volumes:
  captchapi-data:
    driver: local
